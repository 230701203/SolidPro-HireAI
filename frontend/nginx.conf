# Serves the built SPA and reverse-proxies /api to the backend container.
# TLS is terminated in front of this container (load balancer / Caddy / certbot); see docs/DEPLOYMENT.md.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resume uploads (batches are sent as one request: up to 50 files x MAX_UPLOAD_MB). Keep >= that product.
    client_max_body_size 300m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Microphone is needed by the online test (Repeat the Sentence); camera, geolocation etc. are not.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached for a year; index.html must always be revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }
}
