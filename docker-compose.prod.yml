# Production-style stack: Postgres + API + nginx (SPA and /api proxy).
#   cp .env.production.example .env.production   # then fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Put HTTPS in front of the `web` service (see docs/DEPLOYMENT.md). NOT validated against a running Docker daemon yet.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      UPLOAD_DIR: /data/storage
    volumes:
      - uploads:/data/storage
    networks: [internal]
    # No `ports:` on purpose. Only the web container can reach the API.

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [internal]

volumes:
  pgdata:
  uploads:

networks:
  internal:
